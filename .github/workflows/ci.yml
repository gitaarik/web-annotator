name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (app)
        run: npm run check

      - name: Type check (browser-service)
        run: npm run typecheck --workspace=browser-service

      - name: Run tests
        run: npm run test:run
