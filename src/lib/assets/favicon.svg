<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Web Annotator">
	<title>Web Annotator</title>
	<!-- App tile -->
	<rect width="32" height="32" rx="7" fill="#0066cc" />
	<!-- Browser window -->
	<rect x="6" y="7" width="20" height="18" rx="2.5" fill="#ffffff" />
	<!-- Window chrome: header divider + two "traffic light" dots -->
	<line x1="6.5" y1="11.4" x2="25.5" y2="11.4" stroke="#0066cc" stroke-width="1" />
	<circle cx="9" cy="9.2" r="0.85" fill="#0066cc" />
	<circle cx="11.6" cy="9.2" r="0.85" fill="#0066cc" />
	<!-- Click-annotation target marker -->
	<circle cx="16" cy="17.8" r="4.1" fill="none" stroke="#0066cc" stroke-width="1.8" />
	<circle cx="16" cy="17.8" r="1.35" fill="#0066cc" />
</svg>
